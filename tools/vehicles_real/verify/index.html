<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Real vehicle check</title>
<style>html,body{margin:0;background:#9fb4c8;overflow:hidden}canvas{display:block}
#lbl{position:fixed;left:8px;top:6px;font:13px/1.3 monospace;color:#111;background:#fff8;padding:2px 6px}
.tag{position:fixed;font:bold 13px/1.2 sans-serif;color:#fff;background:#0009;padding:1px 5px;transform:translate(-50%,0);white-space:nowrap}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body>
<div id="lbl"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ?models=a,b,old:c,raw:file.glb&lod=0|1&view=front34|rear34|side|top|front|rear|street&night=1&cols=4
//  &toggles=roof_rack,...&paint=#hex&cam=x,y,z,tx,ty,tz&fov=30&labels=1&wire=1&backface=1
//  prefixes: (none) = new set (/models/), old: = generated set (/old/), raw: = raw download (/raw/, auto-fit)
const q = new URLSearchParams(location.search);
const models = (q.get('models') || '').split(',').filter(Boolean);
const lod = q.get('lod') || '0';
const view = q.get('view') || 'front34';
const night = q.get('night') === '1';
const cols = +(q.get('cols') || Math.ceil(Math.sqrt(models.length)));
const showToggles = new Set((q.get('toggles') || '').split(',').filter(Boolean));
const paintsQ = (q.get('paint') || '').split(',').filter(Boolean);
const W = innerWidth, H = innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = night ? 0.6 : 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x0b1020 : 0xa9bdd0);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = night ? 0.08 : 0.8;
const sun = new THREE.DirectionalLight(0xfff4e0, night ? 0.05 : 2.4);
sun.position.set(-30, 50, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(+(q.get('shadow') || 2048), +(q.get('shadow') || 2048));
sun.shadow.bias = -0.0003;
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 150 });
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b5a48, night ? 0.05 : 0.5));
const groundMat = new THREE.MeshStandardMaterial({ color: night ? 0x202020 : 0x6f6c66, roughness: 0.95 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
if (view === 'street') {   // kerb + lane markings for the street-level close-up
  const kerb = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 60), new THREE.MeshStandardMaterial({ color: 0xb8b2a6, roughness: 0.9 }));
  kerb.position.set(-2.2, 0.075, 0); kerb.receiveShadow = true; scene.add(kerb);
  const walk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.15, 60), new THREE.MeshStandardMaterial({ color: 0x9d968a, roughness: 0.95 }));
  walk.position.set(-4.35, 0.075, 0); walk.receiveShadow = true; scene.add(walk);
  for (let z = -30; z < 30; z += 6) {
    const l = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 3), new THREE.MeshStandardMaterial({ color: 0xdedbd0 }));
    l.rotation.x = -Math.PI / 2; l.position.set(1.9, 0.005, z); scene.add(l);
  }
}

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const stats = {};
const group = new THREE.Group();
scene.add(group);

function urlFor(m) {
  if (m.startsWith('raw:')) return `/raw/${m.slice(4)}`;
  if (m.startsWith('old:')) return `/old/${m.slice(4)}${lod === '1' ? '_lod1' : ''}.glb`;
  return `/models/${m}${lod === '1' ? '_lod1' : ''}.glb`;
}
const loaded = await Promise.all(models.map((m) => loader.loadAsync(urlFor(m)).then((g) => [m, g]).catch((e) => [m, null, String(e)])));
loaded.forEach(([name, gltf, err], i) => {
  if (!gltf) { stats[name] = { error: err }; return; }
  const root = gltf.scene;
  const raw = name.startsWith('raw:');
  const vehicle = root.children[0];
  const info = { nodes: [], materials: new Set(), tris: 0, wheels: {}, toggles: [], extras: vehicle?.userData };
  const paints = (() => { try { return JSON.parse(vehicle.userData.paints || '[]'); } catch { return []; } })();
  const paint = paintsQ.length ? paintsQ[i % paintsQ.length] : (paints[(i * 3) % Math.max(1, paints.length)] || '#eeeeea');
  root.traverse((o) => {
    info.nodes.push(o.name);
    if (o.userData && o.userData.toggle) {
      info.toggles.push(o.name);
      o.visible = showToggles.has(o.name) || (!showToggles.size && !!o.userData.default_visible);
      if (showToggles.size && !showToggles.has(o.name) && o.userData.default_visible && !([...showToggles].some((t) => t.split('_')[0] === o.name.split('_')[0]))) o.visible = true;
    }
    if (/^wheel_(f|r)(l|r)$/.test(o.name)) {
      const p = new THREE.Vector3();
      o.getWorldPosition(p);
      info.wheels[o.name] = p.toArray().map((v) => +v.toFixed(3));
    }
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const mat of mats) {
        info.materials.add(mat.name);
        if (mat.name === 'paint' && !raw) mat.color.set(paint);
        if (night && mat.userData.emissiveNight) {
          mat.emissive.fromArray(mat.userData.emissiveNight);
          mat.emissiveIntensity = mat.name === 'light_rear' ? 1.5 : 2.5;
        }
        if (raw && q.get('rawopaque') === '1' && !/glass|window|windshield|lens|light/i.test(mat.name)) { mat.transparent = false; mat.opacity = 1; mat.depthWrite = true; }
        if (q.get('wire') === '1') mat.wireframe = true;
        if (q.get('backface') === '1' && !mat.transparent) {
          mat.side = THREE.DoubleSide;
          mat.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n if (!gl_FrontFacing) gl_FragColor = vec4(1.0,0.0,1.0,1.0);'); };
        }
      }
      const idx = o.geometry.index;
      info.tris += (idx ? idx.count : o.geometry.attributes.position.count) / 3;
    }
  });
  if (raw) {  // auto-fit a raw download: centre it on the ground, longest horizontal axis -> z, 4.7 m long
    root.updateMatrixWorld(true);
    let b = new THREE.Box3().setFromObject(root);
    const s = b.getSize(new THREE.Vector3());
    const holder = new THREE.Group();
    holder.add(root);
    if (s.x > s.z) root.rotation.y = Math.PI / 2;
    root.updateMatrixWorld(true);
    b = new THREE.Box3().setFromObject(holder);
    const len = Math.max(s.x, s.z);
    const k = +(q.get('rawlen') || 4.7) / len;
    holder.scale.setScalar(k);
    holder.updateMatrixWorld(true);
    b = new THREE.Box3().setFromObject(holder);
    const c = b.getCenter(new THREE.Vector3());
    root.position.sub(new THREE.Vector3(c.x, b.min.y, c.z).divideScalar(k));
    info.raw_size = s.toArray().map((v) => +v.toFixed(3));
    holder.userData = { idx: i, name };
    group.add(holder);
  } else {
    root.userData.idx = i;
    root.userData.name = name;
    group.add(root);
  }
  const box = new THREE.Box3().setFromObject(root);
  info.bbox = { min: box.min.toArray().map((v) => +v.toFixed(3)), max: box.max.toArray().map((v) => +v.toFixed(3)), size: box.getSize(new THREE.Vector3()).toArray().map((v) => +v.toFixed(3)) };
  info.materials = [...info.materials].sort();
  info.nodes = info.nodes.filter((n) => n && !/^(Scene|)$/.test(n)).slice(0, 80);
  stats[name] = info;
});
// grid layout: columns along x, rows along z; each row as deep as its longest vehicle
const items = [...group.children].sort((a, b) => a.userData.idx - b.userData.idx);
{
  const sizes = items.map((r) => new THREE.Box3().setFromObject(r).getSize(new THREE.Vector3()));
  const cw = Math.max(...sizes.map((s) => s.x)) + +(q.get('gap') || 1.0);
  let z = 0;
  for (let row = 0; row * cols < items.length; row++) {
    const idx = items.slice(row * cols, row * cols + cols).map((_, k) => row * cols + k);
    const depth = Math.max(...idx.map((k) => sizes[k].z)) + 1.2;
    idx.forEach((k, c) => items[k].position.set((c - (cols - 1) / 2) * cw, 0, z + depth / 2));
    z += depth;
  }
}
const box = new THREE.Box3().setFromObject(group);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const dirs = { front34: [-0.75, 0.42, -1], rear34: [0.8, 0.42, 1], side: [-1, 0.12, 0], top: [0, 1, 0.001], high: [-0.6, 1.2, -1], front: [0, 0.15, -1], rear: [0, 0.15, 1], rside: [1, 0.12, 0], front34r: [0.75, 0.42, -1], rear34l: [-0.8, 0.42, 1] };
const viewList = (q.get('views') || view).split(',');
const gcols = +(q.get('gcols') || Math.ceil(Math.sqrt(viewList.length)));
const grows = Math.ceil(viewList.length / gcols);
const cw = Math.floor(W / gcols), ch = Math.floor(H / grows);
renderer.setScissorTest(true);
const cams = [];
viewList.forEach((vw, k) => {
  const cam = new THREE.PerspectiveCamera(q.get('fov') ? +q.get('fov') : 30, cw / ch, 0.05, 1000);
  if (q.get('cam') && viewList.length === 1) {
    const c = q.get('cam').split(',').map(Number);
    cam.position.set(c[0], c[1], c[2]);
    cam.lookAt(c[3], c[4], c[5]);
  } else {
    const R = Math.max(0.5 * Math.hypot(size.x, size.y, size.z), 2);
    const d = new THREE.Vector3(...(dirs[vw] || dirs.front34)).normalize();
    const dist = (+(q.get('zoom') || 1)) * R / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)) * 0.8 * (cw / ch < 1.3 ? 1.25 : 1);
    cam.position.copy(center).addScaledVector(d, dist);
    cam.lookAt(center.x, (vw === 'top' ? 0 : size.y * 0.3), center.z);
  }
  cam.updateMatrixWorld();
  const cx = (k % gcols) * cw, cy = H - (Math.floor(k / gcols) + 1) * ch;
  renderer.setViewport(cx, cy, cw, ch);
  renderer.setScissor(cx, cy, cw, ch);
  renderer.render(scene, cam);
  cams.push([cam, cx, H - cy - ch, vw]);
});
if (q.get('labels') !== '0') {
  for (const [cam, ox, oy] of cams) {
    for (const it of items) {
      const b = new THREE.Box3().setFromObject(it);
      const p = new THREE.Vector3((b.min.x + b.max.x) / 2, b.max.y + 0.15, (b.min.z + b.max.z) / 2).project(cam);
      if (p.z > 1) continue;
      const el = document.createElement('div');
      el.className = 'tag';
      el.textContent = it.userData.name;
      el.style.left = `${ox + (p.x * 0.5 + 0.5) * cw}px`;
      el.style.top = `${oy + (-p.y * 0.5 + 0.5) * ch - 18}px`;
      document.body.appendChild(el);
    }
  }
}
document.getElementById('lbl').textContent = `lod${lod}  ${view}${night ? ' night' : ''}`;
window.__stats = stats;
window.__ready = true;
</script>
</body>
</html>
